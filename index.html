<title>Кухня · неделя 3–9 августа</title>
<style>
:root{
  --paper:#EEF0E7;
  --card:#FAFBF6;
  --ink:#17231D;
  --ink-soft:#5C6B62;
  --rule:#C9CFBF;
  --beet:#96234C;
  --carrot:#B85A17;
  --leaf:#436B3C;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --serif:Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --pad:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.45;
  padding-bottom:calc(74px + env(safe-area-inset-bottom));
  -webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}

/* ---------- header ---------- */
.top{
  position:sticky;top:0;z-index:20;background:var(--paper);
  padding:calc(10px + env(safe-area-inset-top)) var(--pad) 8px;
  border-bottom:1px solid var(--rule);
}
.top h1{
  font-family:var(--serif);font-weight:normal;font-size:21px;margin:0;
  letter-spacing:-.01em;
}
.top .sub{font-family:var(--mono);font-size:11px;color:var(--ink-soft);
  text-transform:uppercase;letter-spacing:.09em;margin-top:2px}

/* ---------- generic ---------- */
main{padding:14px var(--pad) 24px}
h2{font-family:var(--serif);font-weight:normal;font-size:19px;margin:26px 0 10px}
h2:first-child{margin-top:4px}
.hint{font-size:13px;color:var(--ink-soft);margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:3px;
  padding:12px 13px;margin-bottom:10px}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--ink-soft)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- receipt ---------- */
.receipt{
  background:var(--card);border:1px solid var(--rule);border-radius:2px;
  padding:14px 14px 4px;margin-bottom:18px;font-family:var(--mono);
  position:relative;
}
.receipt::after{
  content:"";position:absolute;left:0;right:0;bottom:-7px;height:7px;
  background:repeating-linear-gradient(-45deg,var(--card) 0 6px,transparent 6px 12px);
}
.receipt .rh{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-soft);display:flex;justify-content:space-between}
.receipt .big{display:flex;align-items:baseline;justify-content:space-between;
  margin:10px 0 2px;padding-top:10px;border-top:1px dashed var(--rule)}
.receipt .big span:first-child{font-size:11.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-soft)}
.receipt .total{font-size:30px;color:var(--beet);font-variant-numeric:tabular-nums}
.receipt .meta{font-size:11.5px;color:var(--ink-soft);padding-bottom:12px}

/* ---------- product rows ---------- */
.group{margin-bottom:20px}
.group .glabel{font-family:var(--mono);font-size:10.5px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--ink-soft);margin:0 0 6px}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;
  border-bottom:1px solid var(--rule)}
.row:last-child{border-bottom:none}
.row .nm{flex:1;min-width:0}
.row .nm b{font-weight:600;font-size:15px;display:block}
.row .nm i{font-style:normal;font-family:var(--mono);font-size:11.5px;color:var(--ink-soft)}
.row .pr{font-family:var(--mono);font-size:13px;color:var(--ink-soft);
  font-variant-numeric:tabular-nums;min-width:46px;text-align:right}
.pill{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  border:1px solid var(--rule);border-radius:999px;padding:5px 9px;min-width:74px;
  text-align:center;color:var(--ink-soft);background:transparent;
}
.pill[data-s="buy"]{border-color:var(--beet);color:var(--beet);background:rgba(150,35,76,.06)}
.pill[data-s="have"]{border-color:var(--leaf);color:#fff;background:var(--leaf)}
.pill[data-s="skip"]{opacity:.5;text-decoration:line-through}
.row[data-s="have"] .nm b,.row[data-s="skip"] .nm b{opacity:.45}
.row[data-s="skip"] .pr{opacity:.35}

/* ---------- day chips ---------- */
.days{display:flex;gap:6px;overflow-x:auto;padding:8px var(--pad) 10px;
  background:var(--paper);position:sticky;top:var(--hh,0px);z-index:19;
  border-bottom:1px solid var(--rule);margin-bottom:14px;
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--rule);border-radius:2px;background:var(--card);
  padding:6px 10px;text-align:center;flex:0 0 auto;min-width:52px}
.chip b{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-soft);font-weight:400}
.chip i{font-style:normal;font-family:var(--serif);font-size:17px}
.chip[aria-selected="true"]{background:var(--ink);border-color:var(--ink)}
.chip[aria-selected="true"] b,.chip[aria-selected="true"] i{color:var(--paper)}

/* ---------- meals ---------- */
.meal{display:flex;gap:11px;align-items:flex-start;background:var(--card);
  border:1px solid var(--rule);border-radius:3px;padding:11px 12px;margin-bottom:8px}
.tick{flex:0 0 auto;width:26px;height:26px;border:1.5px solid var(--rule);
  border-radius:50%;position:relative;margin-top:2px;background:transparent}
.tick[aria-pressed="true"]{background:var(--leaf);border-color:var(--leaf)}
.tick[aria-pressed="true"]::after{content:"";position:absolute;left:8px;top:6px;
  width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;
  transform:rotate(45deg)}
.meal .body{flex:1;min-width:0}
.meal .slot{font-family:var(--mono);font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-soft)}
.meal .ttl{font-size:15.5px;font-weight:600;margin:1px 0 3px}
.meal.done .ttl{opacity:.45;text-decoration:line-through}
.meal .kk{font-family:var(--mono);font-size:12px;color:var(--ink-soft);
  font-variant-numeric:tabular-nums}
.meal .lnk{font-family:var(--mono);font-size:11.5px;color:var(--beet);
  letter-spacing:.04em;margin-top:6px;display:inline-block;
  border-bottom:1px solid rgba(150,35,76,.35)}
.dtot{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:12px;
  color:var(--ink-soft);padding:10px 2px 16px;font-variant-numeric:tabular-nums}
.dtot b{color:var(--ink);font-weight:600}

/* ---------- sweet bank ---------- */
.bank{border:1px solid var(--beet);border-radius:3px;padding:11px 12px;
  margin-bottom:14px;background:rgba(150,35,76,.05)}
.bank .eyebrow{color:var(--beet)}
.bank .v{font-family:var(--mono);font-size:22px;color:var(--beet);
  font-variant-numeric:tabular-nums}
.bank p{margin:4px 0 0;font-size:13px;color:var(--ink-soft)}
.two{display:flex;gap:7px;margin-top:9px}
.two button{flex:1;border:1px solid var(--rule);border-radius:2px;padding:8px 0;
  font-family:var(--mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink-soft);background:var(--card)}
.two button[aria-pressed="true"]{background:var(--beet);border-color:var(--beet);color:#fff}

/* ---------- recipe / accordion ---------- */
.acc{background:var(--card);border:1px solid var(--rule);border-radius:3px;
  margin-bottom:8px;overflow:hidden}
.acc>button{width:100%;text-align:left;padding:12px 13px;display:flex;
  justify-content:space-between;align-items:center;gap:10px}
.acc>button .t{font-weight:600;font-size:15px}
.acc>button .k{font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);
  flex:0 0 auto;font-variant-numeric:tabular-nums}
.acc .in{padding:0 13px 13px;border-top:1px solid var(--rule);display:none}
.acc.open .in{display:block}
.acc .in h4{font-family:var(--mono);font-size:10.5px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--ink-soft);margin:12px 0 5px;font-weight:400}
.ing{list-style:none;padding:0;margin:0}
.ing li{display:flex;justify-content:space-between;gap:10px;font-size:14px;
  padding:3px 0;border-bottom:1px dotted var(--rule)}
.ing li span:last-child{font-family:var(--mono);font-size:12.5px;color:var(--ink-soft);
  flex:0 0 auto;font-variant-numeric:tabular-nums}
.steps{margin:0;padding-left:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;position:relative;padding-left:26px;margin-bottom:8px;
  font-size:14.5px;line-height:1.5}
.steps li::before{content:counter(s);position:absolute;left:0;top:1px;
  font-family:var(--mono);font-size:11px;color:var(--beet);
  border:1px solid var(--beet);border-radius:50%;width:17px;height:17px;
  display:flex;align-items:center;justify-content:center}
.tip{font-size:13.5px;color:var(--ink-soft);border-left:2px solid var(--carrot);
  padding-left:9px;margin-top:10px}

/* ---------- cook steps ---------- */
.cstep{display:flex;gap:11px;align-items:flex-start;padding:10px 0;
  border-bottom:1px solid var(--rule)}
.cstep:last-child{border-bottom:none}
.cstep .box{flex:0 0 auto;width:23px;height:23px;border:1.5px solid var(--rule);
  border-radius:2px;position:relative;background:transparent;margin-top:1px}
.cstep .box[aria-pressed="true"]{background:var(--ink);border-color:var(--ink)}
.cstep .box[aria-pressed="true"]::after{content:"";position:absolute;left:7px;top:4px;
  width:5px;height:10px;border:solid var(--paper);border-width:0 2px 2px 0;
  transform:rotate(45deg)}
.cstep .tx{flex:1;font-size:14.5px;line-height:1.5}
.cstep.done .tx{opacity:.42;text-decoration:line-through}

/* ---------- tabs ---------- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(238,240,231,.97);
  backdrop-filter:blur(12px);border-top:1px solid var(--rule);
  padding:7px 4px calc(7px + env(safe-area-inset-bottom));
  display:grid;grid-template-columns:repeat(4,1fr)}
nav button{padding:5px 2px;text-align:center;color:var(--ink-soft)}
nav button .g{font-family:var(--serif);font-size:18px;display:block;line-height:1.1}
nav button .l{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;
  text-transform:uppercase;display:block;margin-top:2px}
nav button[aria-current="true"]{color:var(--beet)}
nav button:focus-visible,.pill:focus-visible,.tick:focus-visible,.chip:focus-visible,
.acc>button:focus-visible,.two button:focus-visible,.cstep .box:focus-visible{
  outline:2px solid var(--beet);outline-offset:2px}

.foot{margin-top:26px;padding-top:14px;border-top:1px solid var(--rule);
  font-size:13px;color:var(--ink-soft)}
.foot button{font-family:var(--mono);font-size:11px;letter-spacing:.07em;
  text-transform:uppercase;color:var(--beet);border:1px solid var(--rule);
  border-radius:2px;padding:7px 11px;margin-top:10px}
@media (prefers-reduced-motion:no-preference){
  .acc .in{animation:f .18s ease-out}
  @keyframes f{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
}
</style>
</head>

/* ============ storage adapter: window.storage (Claude) или localStorage (Safari) ============ */
const KEY='kuhnya_v1';
const store={
  async get(){
    try{
      if(window.storage&&window.storage.get){const r=await window.storage.get(KEY);return r&&r.value?JSON.parse(r.value):null;}
      const v=localStorage.getItem(KEY);return v?JSON.parse(v):null;
    }catch(e){return null;}
  },
  async set(obj){
    const s=JSON.stringify(obj);
    try{
      if(window.storage&&window.storage.set){await window.storage.set(KEY,s);return;}
      localStorage.setItem(KEY,s);
    }catch(e){/* работаем в памяти */}
  }
};

 {d:'4',w:'Вт',k:1510,p:125,f:60,c:115,m:['z2','o1','p2','u3']},
 {d:'5',w:'Ср',k:1528,p:108,f:63,c:130,m:['z1','o1','p3','u2']},
 {d:'6',w:'Чт',k:1523,p:116,f:61,c:127,m:['z2','o2','p1','u1']},
 {d:'7',w:'Пт',k:1539,p:107,f:63,c:139,m:['z1','o2','p2','u4']},

/* ============ рендер ============ */
const app=document.getElementById('app');
const ttl=document.getElementById('ttl');
const sub=document.getElementById('sub');
let tab='rev', day=0, openRec=null;
const esc=s=>String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
const st=id=>state.prod[id]||'buy';
const LBL={buy:'купить',have:'есть дома',skip:'не нужно'};

function sums(){
  let buy=0,have=0,n=0;
  [...WEEKLY,...PANTRY].forEach(g=>g.items.forEach(([id,,,pr])=>{
    const s=st(id);
    if(s==='buy'){buy+=pr;n++;} else if(s==='have'){have+=pr;}
  }));
  return {buy,have,n};
}

function rev(){
  const s=sums();
  let h=`<main>
  <div class="receipt">
    <div class="rh"><span>предварительный чек</span><span>неделя 03–09.08</span></div>
    <div class="big"><span>к докупке</span><span class="total">${s.buy.toLocaleString('ru')} ₽</span></div>
    <div class="meta">${s.n} позиций · уже дома на ${s.have.toLocaleString('ru')} ₽</div>
  </div>
  <p class="hint">Пройди по списку и нажми на метку справа: <b>купить → есть дома → не нужно</b>. Чек сверху пересчитывается сам.</p>`;
  const grp=(arr)=>arr.map(g=>`<div class="group"><p class="glabel">${esc(g.c)}</p>`+
    g.items.map(([id,nm,q,pr])=>{
      const s2=st(id);
      return `<div class="row" data-s="${s2}"><div class="nm"><b>${esc(nm)}</b><i>${esc(q)}</i></div>
      <div class="pr">${pr} ₽</div>
      <button class="pill" data-s="${s2}" data-id="${id}" aria-label="${esc(nm)}: ${LBL[s2]}">${LBL[s2]}</button></div>`;
    }).join('')+`</div>`).join('');
  h+=grp(WEEKLY);
  h+=`<h2>Запас</h2><p class="hint">Покупается один раз и хватает на 3–5 недель. Из-за него первая закупка дороже — это не перерасход.</p>`;
  h+=grp(PANTRY);
  h+=`<div class="foot">Ревизию имеет смысл делать до похода в магазин, стоя у полок дома. Всё, чего нет в этом списке, в корзину не попадает — даже со скидкой.
  <br><button id="reset">Сбросить все отметки</button></div></main>`;
  return h;
}

function bank(){
  const saved=DAYS.reduce((a,_,i)=>a+(state.sweet[i]==='saved'?120:0),0);
  if(!saved) return '';
  let txt='Хватит на пирожное или два зефира сверх нормы.';
  if(saved>=360) txt='Хватит на настоящий кусок торта в кофейне — без нарушения плана.';
  else if(saved>=240) txt='Хватит на пирожное.';
  return `<div class="bank"><div class="eyebrow">Копилка сладкого</div>
    <div class="v">${saved} ккал</div><p>${txt}</p></div>`;
}

function menu(){
  const D=DAYS[day];
  let h=`<div class="days">`+DAYS.map((x,i)=>
    `<button class="chip" data-d="${i}" aria-selected="${i===day}"><b>${x.w}</b><i>${x.d}</i></button>`).join('')+`</div><main>`;
  h+=bank();
  h+=`<div class="dtot"><span>Итого <b>${D.k} ккал</b></span><span>Б <b>${D.p}</b></span><span>Ж <b>${D.f}</b></span><span>У <b>${D.c}</b></span></div>`;
  D.m.forEach(id=>{
    const m=M[id],key=day+':'+id,done=!!state.eaten[key];
    h+=`<div class="meal ${done?'done':''}"><button class="tick" data-e="${key}" aria-pressed="${done}" aria-label="Съедено"></button>
    <div class="body"><div class="slot">${esc(m.slot)}</div><div class="ttl">${esc(m.t)}</div>
    <div class="kk">${m.k} ккал · Б ${m.p} / Ж ${m.f} / У ${m.c}</div>
    <button class="lnk" data-r="${id}">рецепт →</button></div></div>`;
  });
  const sw=state.sweet[day]||'';
  h+=`<div class="meal"><button class="tick" data-sw="eaten" aria-pressed="${sw==='eaten'}" aria-label="Съедено"></button>
    <div class="body"><div class="slot">Сладкое</div><div class="ttl">Сладкий слот — 120 ккал</div>
    <div class="kk">уже внутри нормы, не сверх неё</div>
    <div class="two"><button data-sw="eaten" aria-pressed="${sw==='eaten'}">съела</button>
    <button data-sw="saved" aria-pressed="${sw==='saved'}">отложила</button></div>
    <button class="lnk" data-r="sw">варианты на 120 ккал →</button></div></div>`;
  h+=`<div class="foot">Дни считаются по неделе, а не по суткам. Один день на 1550 ккал ничего не меняет.</div></main>`;
  return h;
}

function cook(){
  let h=`<main><p class="hint">Две сессии вместо семи вечеров. Отмечай шаги — после перерыва не придётся вспоминать, где остановилась.</p>`;
  COOK.forEach((c,ci)=>{
    h+=`<h2>${esc(c.t)}</h2><p class="hint">${esc(c.sub)}</p><div class="card">`;
    c.s.forEach((s,si)=>{
      const key='c'+ci+'_'+si,done=!!state.cook[key];
      h+=`<div class="cstep ${done?'done':''}"><button class="box" data-c="${key}" aria-pressed="${done}" aria-label="Готово"></button><div class="tx">${esc(s)}</div></div>`;
    });
    h+=`</div>`;
  });
  h+=`<div class="foot">Рыба и салаты заранее не готовятся — они делаются в день подачи за 10–15 минут.</div></main>`;
  return h;
}

function rec(){
  let h=`<main><p class="hint">Веса мяса и рыбы — в сыром виде, крупы — в сухом. Нажми на блюдо, чтобы раскрыть.</p>`;
  const order=['z1','z2','o1','o2','o3','p1','p2','p3','u1','u2','u3','u4','u5','sw'];
  order.forEach(id=>{
    const m=M[id],op=openRec===id;
    h+=`<div class="acc ${op?'open':''}"><button data-a="${id}" aria-expanded="${op}">
      <span class="t">${esc(m.t)}</span><span class="k">${m.k} ккал</span></button>
      <div class="in"><h4>${id==='sw'?'Варианты':'Состав'}</h4><ul class="ing">`+
      m.ing.map(([a,b])=>`<li><span>${esc(a)}</span><span>${esc(b)}</span></li>`).join('')+
      `</ul><h4>${id==='sw'?'Как это работает':'Приготовление'}</h4><ol class="steps">`+
      m.st.map(s=>`<li>${esc(s)}</li>`).join('')+`</ol>`+
      (m.tip?`<div class="tip">${esc(m.tip)}</div>`:'')+`</div></div>`;
  });
  h+=`</main>`;
  return h;
}

const TITLES={rev:['Ревизия','что есть, что докупить'],menu:['Меню','3–9 августа · 1500 ккал'],
  cook:['Готовка','две сессии на неделю'],rec:['Рецепты','14 блюд недели']};
function render(){
  const [a,b]=TITLES[tab];ttl.textContent=a;sub.textContent=b;
  app.innerHTML=tab==='rev'?rev():tab==='menu'?menu():tab==='cook'?cook():rec();
  document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-current',x.dataset.t===tab));
  const th=document.querySelector('.top');
  if(th)document.documentElement.style.setProperty('--hh',th.offsetHeight+'px');
}
window.addEventListener('resize',()=>{const th=document.querySelector('.top');
  if(th)document.documentElement.style.setProperty('--hh',th.offsetHeight+'px');});

document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.t){tab=t.dataset.t;window.scrollTo(0,0);render();return;}
  if(t.dataset.id){
    const cur=st(t.dataset.id);
    state.prod[t.dataset.id]=cur==='buy'?'have':cur==='have'?'skip':'buy';
    save();render();return;
  }
  if(t.dataset.d!==undefined){day=+t.dataset.d;render();return;}
  if(t.dataset.e){state.eaten[t.dataset.e]=!state.eaten[t.dataset.e];save();render();return;}
  if(t.dataset.sw){
    state.sweet[day]=state.sweet[day]===t.dataset.sw?'':t.dataset.sw;save();render();return;
  }
  if(t.dataset.r){openRec=t.dataset.r;tab='rec';window.scrollTo(0,0);render();
    setTimeout(()=>{const el=document.querySelector('.acc.open');if(el)el.scrollIntoView({block:'center',behavior:'smooth'});},60);return;}
  if(t.dataset.a){openRec=openRec===t.dataset.a?null:t.dataset.a;render();return;}
  if(t.id==='reset'){state={prod:{},eaten:{},sweet:{},cook:{}};save();render();return;}
  if(t.dataset.c){state.cook[t.dataset.c]=!state.cook[t.dataset.c];save();render();return;}
});

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
(async()=>{
  const s=await store.get();
  if(s&&typeof s==='object'){state={prod:s.prod||{},eaten:s.eaten||{},sweet:s.sweet||{},cook:s.cook||{}};}
  render();
})();
</script>
</body>
